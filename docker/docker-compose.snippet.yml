# Merge this service into your existing Misskey docker-compose.yml (or `docker compose
# -f docker-compose.yml -f docker-compose.apmail.yml up -d` with this saved separately —
# either works, this is just the service definition).
#
# network_mode: host — chosen deliberately, not the Compose default. Postfix is assumed
# to run directly on the VPS host (per your setup), not in a container. With the default
# bridge network, "127.0.0.1" inside this container would be the *container's* loopback,
# not the host's — so the container couldn't reach host Postfix on 127.0.0.1:587, and
# host Postfix's transport_maps couldn't reach the container's inbound SMTP listener on
# 127.0.0.1:2525 either, without extra port-publishing/DNS gymnastics. `network_mode:
# host` sidesteps all of that: INBOUND_SMTP_HOST/MAIL_RELAY_HOST in .env can stay exactly
# "127.0.0.1", identical to a bare-metal deployment, and your reverse proxy (wherever it
# runs) reaches the bridge the same way it would a bare-metal process, via
# 127.0.0.1:$HTTP_PORT. Trade-off: this container shares the host's network namespace
# instead of getting Docker's usual isolation. If you later containerize Postfix too,
# switch to a shared bridge network and point INBOUND_SMTP_HOST/MAIL_RELAY_HOST at that
# service's container name instead — network_mode: host and a custom `networks:` block
# are mutually exclusive.
#
# host networking is Linux-only; this will not work as-is on Docker Desktop (macOS/
# Windows) — fine here since the deploy target is a Linux VPS.

services:
  apmail:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: apmail
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - apmail-keys:/data/keys
      - apmail-db:/data/db
      - apmail-attachments:/data/attachments
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.HTTP_PORT||8080)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s

volumes:
  apmail-keys:
  apmail-db:
  apmail-attachments:
